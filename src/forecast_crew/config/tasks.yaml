tarefa_agregacao:
  description: >
    Agrega as cinco estimativas (Ortodoxa, Marxista, Social-Democrata, Libertária e Base Rates) numa estimativa final.
    Apresenta a média, a dispersão entre perfis e uma discussão da incerteza ideológica.
    OBRIGATÓRIO: A tua resposta deve terminar EXATAMENTE com esta linha: "ESTIMATIVA_FINAL: [número]".
  expected_output: >
    Um relatório em Markdown com a estimativa final e a linha obrigatória no fim.
  agent: redator
  context:
    - tarefa_estimativa_ortodoxa
    - tarefa_estimativa_marxista
    - tarefa_estimativa_social_democrata
    - tarefa_estimativa_libertario
    - tarefa_estimativa_base_rates