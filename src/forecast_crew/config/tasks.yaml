tarefa_evidencia:
  description: >
    Lê atentamente o seguinte pacote de evidência fornecido:
    {pacote_evidencia}
    A tua tarefa é organizar e resumir esta informação em 5 a 10 pontos-chave focados em economia, tensões sociais e políticas públicas.
    NÃO podes acrescentar informação externa. Usa apenas o texto acima.
  expected_output: >
    Um resumo estruturado em Markdown com os pontos-chave extraídos do texto fornecido.
  agent: analista_base_rates

tarefa_estimativa_ortodoxa:
  description: >
    Com base no pacote de evidência, estima a probabilidade (0–100%) de {tipo_evento} nos {pais} em {horizonte}.
    OBRIGATÓRIO: A tua resposta deve terminar EXATAMENTE com esta linha: "ESTIMATIVA_FINAL: [número]".
  expected_output: >
    Uma justificação breve e a linha final obrigatória.
  agent: economista_ortodoxo
  context: [tarefa_evidencia]

